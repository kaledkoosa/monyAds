<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تعدين KAK</title>
    <script src="https://telegram.org"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            padding: 0; 
            padding-bottom: 80px; 
            box-sizing: border-box;
        }
        .card { background-color: #1e293b; border-radius: 15px; padding: 20px; margin-bottom: 15px; text-align: center; }
        .balance { font-size: 2.5rem; color: #38bdf8; font-weight: bold; margin: 10px 0; }
        .input-box { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; margin: 10px 0; text-align: center; }
        .btn { background-color: #0284c7; color: white; border: none; padding: 14px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer; width: 100%; margin: 8px 0; font-weight: bold; }
        .btn:active { background-color: #0369a1; }
        .btn-ad { background-color: #eab308; color: #0f172a; }
        .btn-share { background-color: #10b981; }
        .nav-tabs { position: fixed; bottom: 0; left: 0; right: 0; height: 65px; background-color: #1e293b; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #334155; z-index: 1000; }
        .tab-button { background: none; border: none; color: #94a3b8; font-size: 0.85rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; flex-grow: 1; padding: 8px 0; font-weight: bold; }
        .tab-button .icon { font-size: 1.4rem; margin-bottom: 3px; }
        .tab-button.active { color: #38bdf8; }
    </style>
</head>
<body>

    <!-- 1. صفحة التعدين -->
    <div id="mining-page" class="tab-content active">
        <div class="card">
            <h3>⚡ التعدين السحابي التلقائي</h3>
            <p style="color: #94a3b8;">الباقة المجانية (10 KAK / يومياً)</p>
            <div class="balance" id="mining-counter">0.000000</div>
        </div>
    </div>

    <!-- 2. صفحة المهام والإعلانات -->
    <div id="tasks-page" class="tab-content">
        <div class="card">
            <h3>📺 مشاهدة الإعلانات</h3>
            <button class="btn btn-ad" onclick="watchAd()">🎬 شاهد إعلان واربح (+15 KAK)</button>
        </div>
        <div class="card">
            <h3>📋 المهام المدعومة</h3>
            <button class="btn" onclick="completeTask('telegram')">📢 انضم لقناة التليجرام (+100 KAK)</button>
            <button class="btn" onclick="completeTask('x')">🐦 تابع حسابنا على X (+100 KAK)</button>
        </div>
    </div>

    <!-- 3. صفحة المحفظة ونظام الإحالة -->
    <div id="wallet-page" class="tab-content">
        <div class="card">
            <h3>💰 رصيدك الإجمالي المتوفر</h3>
            <div class="balance"><span id="live-user-balance">0.00</span> KAK</div>
        </div>
        <div class="card">
            <h3>💳 تبديل الرصيد والسحب إلى Tonkeeper</h3>
            <input type="text" id="wallet-input" class="input-box" placeholder="أدخل عنوان محفظة TON">
            <button class="btn" onclick="requestWithdrawalFromApp()">🔄 تبديل وسحب الرصيد بالكامل</button>
        </div>
        <div class="card">
            <h3>👥 نظام الإحالة</h3>
            <input type="text" id="referral-link-box" class="input-box" readonly>
            <button class="btn btn-share" onclick="shareReferralLink()">🔗 دعوة صديق الآن</button>
        </div>
    </div>

    <!-- شريط التبويبات -->
    <nav class="nav-tabs">
        <button class="tab-button active" onclick="switchTab('mining-page', this)">⛏️ التعدين</button>
        <button class="tab-button" onclick="switchTab('tasks-page', this)">📺 المهام</button>
        <button class="tab-button" onclick="switchTab('wallet-page', this)">👛 المحفظة</button>
    </nav>

    <!-- البرمجة الذكية والاغلاقات الرسمية -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const userId = user ? user.id : null;
        const API_BASE_URL = window.location.origin; 
        const SECRET_TOKEN = "MY_SUPER_SECRET_KEY_123"; 

        let sessionMined = 0.0;
        const ratePerSecond = 10 / 86400;

        if (userId) {
            document.getElementById('referral-link-box').value = `https://t.me{userId}`;
            setInterval(() => {
                sessionMined += ratePerSecond;
                document.getElementById('mining-counter').innerText = sessionMined.toFixed(6);
            }, 1000);
            fetchUserBalance(); 
        } else {
            document.getElementById('referral-link-box').value = "افتح التطبيق من تليجرام";
            setInterval(() => {
                sessionMined += ratePerSecond;
                document.getElementById('mining-counter').innerText = sessionMined.toFixed(6);
            }, 1000);
        }

        function switchTab(tabId, buttonElement) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.style.display = 'none');
            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            buttonElement.classList.add('active');
            if(tabId === 'wallet-page' && userId) fetchUserBalance();
        }

        function fetchUserBalance() {
            if (!userId) return;
            fetch(`${API_BASE_URL}/api/get_balance?user_id=${userId}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") document.getElementById('live-user-balance').innerText = data.balance.toFixed(2);
            });
        }

        function requestWithdrawalFromApp() {
            const walletAddress = document.getElementById('wallet-input').value.trim();
            if (!walletAddress || walletAddress.length < 40) { alert("عنوان المحفظة غير صحيح!"); return; }
            fetch(`${API_BASE_URL}/api/app_withdraw`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: parseInt(userId), wallet: walletAddress, secret_key: SECRET_TOKEN })
            }).then(res => res.json()).then(data => {
                if (data.status === "success") { alert("✅ تم تسجيل الطلب بنجاح!"); fetchUserBalance(); }
            });
        }

        function shareReferralLink() {
            const refLink = document.getElementById('referral-link-box').value;
            tg.openTelegramLink(`https://t.me{encodeURIComponent(refLink)}&text=${encodeURIComponent('انضم لتعدين KAK! ⛏️💎')}`);
        }

        function watchAd() {
            alert("انتظر 5 ثوانٍ...");
            setTimeout(() => { alert("✨ حصلت على 15 KAK"); sendRewardToBackend(15); }, 5000);
        }

        function completeTask(platform) {
            if (platform === 'telegram') window.open("https://t.me", "_blank");
            setTimeout(() => { alert("✅ حصلت على 100 KAK"); sendRewardToBackend(100); }, 3000);
        }

        function sendRewardToBackend(amount) {
            if (!userId) return;
            fetch(`${API_BASE_URL}/api/reward`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ user_id: parseInt(userId), amount: parseFloat(amount), secret_key: SECRET_TOKEN })
            }).then(() => fetchUserBalance());
        }
    </script>
</body>
</html>
